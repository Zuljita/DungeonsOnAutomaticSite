name: Mirror App Release Downloads

# Copies each On Automatic desktop app's rolling release out of the private
# monorepo (Zuljita/OnAutomatic) into a public release on this repository, and
# writes the per-app data files the pages render (downloads/releases/changelog).
#
# One workflow, many apps: `data/apps.json` is the registry — source tag,
# target tag, data directory, and the download table (asset names must match
# the app's electron-builder artifactName). Dungeons keeps the site's original
# `continuous` release so installed updaters never see their feed URL change;
# every other app gets its own `<app>-continuous`.
#
# Triggers: the app's build workflow dispatches `app_release_published` with
# `client_payload.app` right after publishing; the 15-minute schedule is the
# fallback and walks every app. An app whose source release does not exist yet
# (Hexes before its first published build) is skipped by the schedule, but a
# dispatch that names it is an error — the app just told us it published.

on:
  repository_dispatch:
    types: [app_release_published]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: mirror-app-release
  cancel-in-progress: false

jobs:
  plan:
    name: Which apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4
        with:
          sparse-checkout: data/apps.json
          sparse-checkout-cone-mode: false

      - name: Decide which apps to mirror
        id: plan
        env:
          DISPATCH_APP: ${{ github.event.client_payload.app }}
          DISPATCH_SOURCE_TAG: ${{ github.event.client_payload.source_tag }}
        run: |
          set -euo pipefail
          all="$(jq -c '[.apps[].id]' data/apps.json)"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            app="${DISPATCH_APP:-}"
            if [ -z "$app" ]; then
              # Pre-monorepo dispatch shape (no `app`): the source tag names the app
              # by prefix, or it is the original bare `continuous` = Dungeons.
              case "${DISPATCH_SOURCE_TAG:-continuous}" in
                hexes-*) app="hexes" ;;
                *) app="dungeons" ;;
              esac
            fi
            if ! jq -e --arg app "$app" '.apps[] | select(.id == $app)' data/apps.json >/dev/null; then
              echo "::error title=Unknown app::'$app' is not registered in data/apps.json."
              exit 1
            fi
            apps="$(jq -cn --arg app "$app" '[$app]')"
          else
            apps="$all"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Mirroring: $apps" >> "$GITHUB_STEP_SUMMARY"

  mirror:
    name: Mirror ${{ matrix.app }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every app commits to main; serialise so the pushes never race.
      max-parallel: 1
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      TARGET_REPO: Zuljita/DungeonsOnAutomaticSite
      SOURCE_TOKEN: ${{ secrets.DOA_RELEASE_MIRROR_TOKEN }}
      TARGET_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4

      - name: Resolve app configuration
        run: |
          set -euo pipefail
          jq -e --arg app "$APP" '.apps[] | select(.id == $app)' data/apps.json > mirror-app.json
          {
            echo "SOURCE_REPO=$(jq -r '.sourceRepo' data/apps.json)"
            echo "SOURCE_TAG=$(jq -r '.sourceTag' mirror-app.json)"
            echo "TARGET_TAG=$(jq -r '.targetTag' mirror-app.json)"
            echo "DATA_DIR=$(jq -r '.dataDir' mirror-app.json)"
            echo "APP_NAME=$(jq -r '.name' mirror-app.json)"
          } >> "$GITHUB_ENV"

      - name: Preflight source release access
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR" mirror-meta
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error title=Missing release mirror token::DOA_RELEASE_MIRROR_TOKEN is not set."
            exit 1
          fi

          if GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPO/releases/tags/$SOURCE_TAG" \
            > mirror-meta/source-release.json 2> mirror-meta/source-release.err; then
            echo "Reading $SOURCE_REPO@$SOURCE_TAG for $APP_NAME."
            exit 0
          fi

          if grep -q "HTTP 404" mirror-meta/source-release.err && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::notice title=Nothing to mirror yet::$SOURCE_REPO has no $SOURCE_TAG release yet ($APP_NAME has not published a build). Skipping."
            echo "MIRROR_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "::error title=Cannot read source release::DOA_RELEASE_MIRROR_TOKEN could not read ${SOURCE_REPO}@${SOURCE_TAG}: $(cat mirror-meta/source-release.err)"
          exit 1

      - name: Read source metadata
        run: |
          [ "$MIRROR_SKIP" = "1" ] && exit 0
          jq -r '.body // ""' mirror-meta/source-release.json > release-notes.md
          {
            echo ""
            echo "---"
            echo "Mirrored from $SOURCE_REPO release $SOURCE_TAG."
          } >> release-notes.md
          jq -r --arg fallback "$APP_NAME — continuous build" '.name // $fallback' mirror-meta/source-release.json \
            > release-title.txt
          jq '[.assets[] | {name, size, digest}] | sort_by(.name)' \
            mirror-meta/source-release.json > mirror-meta/source-assets.json

      - name: Write public release list
        # The monorepo publishes every app's releases in one place; this app's
        # are the ones whose tag carries its prefix.
        run: |
          [ "$MIRROR_SKIP" = "1" ] && exit 0
          GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPO/releases" \
            --paginate \
            --jq "[.[] | select(.draft == false) | select(.tag_name | startswith(\"$APP-\")) | {tagName: .tag_name, name: .name, publishedAt: .published_at, isPrerelease: .prerelease, body: (.body // \"\")}]" \
            > "$DATA_DIR/releases.json"

      - name: Merge the release changelog into the public changelog
        # The app publishes one rolling release, so its notes only ever describe
        # the newest build. <dataDir>/changelog.json is this repository's
        # cumulative history for the app, built by merging each release's
        # release-changelog.json into what is already committed. The merge is
        # keyed and idempotent, so a mirror run with nothing new changes nothing.
        run: |
          [ "$MIRROR_SKIP" = "1" ] && exit 0
          rm -rf mirror-meta/changelog
          mkdir -p mirror-meta/changelog
          if ! GH_TOKEN="$SOURCE_TOKEN" gh release download "$SOURCE_TAG" \
            --repo "$SOURCE_REPO" \
            --pattern "release-changelog.json" \
            --dir mirror-meta/changelog \
            --clobber; then
            echo "::warning title=No release changelog asset::${SOURCE_REPO}@${SOURCE_TAG} has no release-changelog.json, so the public changelog keeps its existing entries."
            exit 0
          fi

          node scripts/merge-changelog.mjs mirror-meta/changelog/release-changelog.json "$DATA_DIR/changelog.json"

      - name: Write public download metadata
        run: |
          [ "$MIRROR_SKIP" = "1" ] && exit 0
          rm -rf mirror-meta/download-metadata
          mkdir -p mirror-meta/download-metadata
          GH_TOKEN="$SOURCE_TOKEN" gh release download "$SOURCE_TAG" \
            --repo "$SOURCE_REPO" \
            --pattern "latest*.yml" \
            --dir mirror-meta/download-metadata \
            --clobber || echo "No updater metadata on the source release (an app without electron-updater); versions come from the release only."
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const app = JSON.parse(fs.readFileSync("mirror-app.json", "utf8"));
          const release = JSON.parse(fs.readFileSync("mirror-meta/source-release.json", "utf8"));
          const assetByName = new Map((release.assets || []).map((asset) => [asset.name, asset]));
          const metadataDir = "mirror-meta/download-metadata";

          // Public download URL for a mirrored asset. This MUST be built from
          // the target repo: the source release lives in the private app repo,
          // so its `browser_download_url` 404s for everyone who is not a
          // collaborator. Size and digest still come from the source asset —
          // the mirror copies those bytes verbatim.
          const targetRepo = process.env.TARGET_REPO;
          const targetTag = process.env.TARGET_TAG;
          function publicDownloadUrl(assetName) {
            if (!targetRepo || !targetTag) throw new Error("TARGET_REPO/TARGET_TAG are required to build public download URLs");
            return `https://github.com/${targetRepo}/releases/download/${targetTag}/${encodeURIComponent(assetName)}`;
          }

          function readFeed(name) {
            const file = path.join(metadataDir, name);
            if (!fs.existsSync(file)) return {};
            const text = fs.readFileSync(file, "utf8");
            const version = text.match(/^version:\s*['"]?([^'"\n]+)['"]?/m)?.[1] ?? null;
            const releaseDate = text.match(/^releaseDate:\s*['"]?([^'"\n]+)['"]?/m)?.[1] ?? null;
            return { version, releaseDate };
          }

          const downloads = app.downloads;
          const feedByName = new Map([...new Set(downloads.map((download) => download.feed))]
            .map((feed) => [feed, readFeed(feed)]));

          const output = {
            schemaVersion: 1,
            app: app.id,
            releaseTag: targetTag,
            sourceReleaseTag: release.tag_name,
            releaseName: release.name,
            publishedAt: release.published_at,
            updatedAt: release.updated_at,
            generatedAt: new Date().toISOString(),
            downloads: downloads.map((download) => {
              const asset = assetByName.get(download.asset);
              const feed = feedByName.get(download.feed) || {};
              return {
                id: download.id,
                label: download.label,
                assetName: download.asset,
                feedName: download.feed,
                version: feed.version,
                releaseDate: feed.releaseDate,
                size: asset?.size ?? null,
                digest: asset?.digest ?? null,
                url: asset ? publicDownloadUrl(download.asset) : null,
              };
            }),
          };

          const dataDir = process.env.DATA_DIR;
          fs.mkdirSync(dataDir, { recursive: true });
          fs.writeFileSync(path.join(dataDir, "downloads.json"), `${JSON.stringify(output, null, 2)}\n`);
          NODE

      - name: Compare mirrored assets
        run: |
          [ "$MIRROR_SKIP" = "1" ] && exit 0
          if GH_TOKEN="$TARGET_TOKEN" gh api "repos/$TARGET_REPO/releases/tags/$TARGET_TAG" \
            > mirror-meta/target-release.json 2>/dev/null; then
            jq '[.assets[] | {name, size, digest}] | sort_by(.name)' \
              mirror-meta/target-release.json > mirror-meta/target-assets.json
            rm -rf mirror-meta/source-updater mirror-meta/target-updater
            mkdir -p mirror-meta/source-updater mirror-meta/target-updater
            GH_TOKEN="$SOURCE_TOKEN" gh release download "$SOURCE_TAG" \
              --repo "$SOURCE_REPO" \
              --pattern "latest*.yml" \
              --dir mirror-meta/source-updater \
              --clobber >/dev/null 2>&1 || true
            GH_TOKEN="$TARGET_TOKEN" gh release download "$TARGET_TAG" \
              --repo "$TARGET_REPO" \
              --pattern "latest*.yml" \
              --dir mirror-meta/target-updater \
              --clobber >/dev/null 2>&1 || true
            (
              cd mirror-meta/source-updater
              find . -type f -print | sort | while IFS= read -r file; do sha256sum "$file"; done
            ) > mirror-meta/source-updater.sha256
            (
              cd mirror-meta/target-updater
              find . -type f -print | sort | while IFS= read -r file; do sha256sum "$file"; done
            ) > mirror-meta/target-updater.sha256
            if cmp -s mirror-meta/source-assets.json mirror-meta/target-assets.json && \
              cmp -s mirror-meta/source-updater.sha256 mirror-meta/target-updater.sha256; then
              echo "Mirrored release assets are already current. Skipping asset download/upload."
              echo "MIRROR_ASSETS_CHANGED=0" >> "$GITHUB_ENV"
            else
              echo "Mirrored release assets or updater metadata differ from source. Asset mirror is required."
              echo "MIRROR_ASSETS_CHANGED=1" >> "$GITHUB_ENV"
            fi
          else
            echo "Target release does not exist. Asset mirror is required."
            echo "MIRROR_ASSETS_CHANGED=1" >> "$GITHUB_ENV"
          fi

      - name: Create or update public release
        run: |
          [ "$MIRROR_SKIP" = "1" ] && exit 0
          title="$(cat release-title.txt)"
          if GH_TOKEN="$TARGET_TOKEN" gh release view "$TARGET_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            GH_TOKEN="$TARGET_TOKEN" gh release edit "$TARGET_TAG" \
              --repo "$TARGET_REPO" \
              --title "$title" \
              --notes-file release-notes.md
          else
            GH_TOKEN="$TARGET_TOKEN" gh release create "$TARGET_TAG" \
              --repo "$TARGET_REPO" \
              --target main \
              --title "$title" \
              --notes-file release-notes.md
          fi

      - name: Download source assets
        run: |
          [ "$MIRROR_SKIP" = "1" ] && exit 0
          [ "$MIRROR_ASSETS_CHANGED" != "1" ] && exit 0
          mkdir -p mirror-assets
          GH_TOKEN="$SOURCE_TOKEN" gh release download "$SOURCE_TAG" \
            --repo "$SOURCE_REPO" \
            --dir mirror-assets \
            --clobber

      - name: Replace mirrored assets
        run: |
          [ "$MIRROR_SKIP" = "1" ] && exit 0
          [ "$MIRROR_ASSETS_CHANGED" != "1" ] && exit 0
          GH_TOKEN="$TARGET_TOKEN" gh release view "$TARGET_TAG" \
            --repo "$TARGET_REPO" \
            --json assets \
            --jq '.assets[].name' > existing-assets.txt
          while IFS= read -r asset; do
            [ -z "$asset" ] && continue
            GH_TOKEN="$TARGET_TOKEN" gh release delete-asset "$TARGET_TAG" "$asset" \
              --repo "$TARGET_REPO" \
              --yes
          done < existing-assets.txt
          GH_TOKEN="$TARGET_TOKEN" gh release upload "$TARGET_TAG" mirror-assets/* \
            --repo "$TARGET_REPO" \
            --clobber

      - name: Commit public release data
        run: |
          [ "$MIRROR_SKIP" = "1" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DATA_DIR/releases.json" "$DATA_DIR/downloads.json" "$DATA_DIR/changelog.json"
          if git diff --cached --quiet; then
            echo "No public release metadata changes to commit for $APP_NAME."
          else
            git commit -m "Update public release metadata ($APP)"
            # Another app's job may have pushed while this one ran (max-parallel 1
            # serialises the jobs, but this checkout predates that push). Each app
            # touches only its own data files, so the rebase never conflicts.
            git pull --rebase --quiet origin main
            git push
            # Pushes made with GITHUB_TOKEN do not trigger on:push workflows,
            # so kick the Cloudflare deploy explicitly.
            GH_TOKEN="$TARGET_TOKEN" gh workflow run deploy.yml --repo "$TARGET_REPO"
          fi
