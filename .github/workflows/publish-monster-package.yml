name: Mirror Public Monster Package

on:
  # The data repo posts this the moment it publishes, which is the fast path.
  # It needs a cross-repo token there, and a missing one fails silently on that
  # side, so it cannot be the only path: 0.3.1 and 0.3.2 both shipped without
  # ever reaching this workflow.
  repository_dispatch:
    types: [monster_package_published]
  # The path that cannot silently stop working. DungeonsOnAutomaticMonsters is
  # public, so resolving its latest release needs no credential at all. A run
  # that finds nothing new commits nothing and costs a minute.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      source_tag:
        description: Monster data-repo release tag. Leave blank to take the latest release.
        required: false
        type: string
      asset_name:
        description: JSON asset name
        required: true
        default: doa-monsters.json
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: public-monster-package
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      SOURCE_TAG: ${{ github.event.client_payload.source_tag || inputs.source_tag }}
      ASSET_NAME: ${{ github.event.client_payload.asset_name || inputs.asset_name || 'doa-monsters.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A scheduled run carries no tag, so ask the source repo what its newest
      # release is. Explicit tags from a dispatch are left alone, so replaying
      # an older release still works.
      - name: Resolve the release to mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SOURCE_TAG" ]; then
            SOURCE_TAG=$(gh release view --repo Zuljita/DungeonsOnAutomaticMonsters --json tagName -q .tagName)
            echo "Resolved latest release: $SOURCE_TAG"
            echo "SOURCE_TAG=$SOURCE_TAG" >> "$GITHUB_ENV"
          else
            echo "Using requested release: $SOURCE_TAG"
          fi
      # DungeonsOnAutomaticMonsters is a public repository, so its release assets
      # are readable with this workflow's own token. A dedicated cross-repo PAT
      # was only needed while the source repo was private.
      - name: Download approved source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          gh release download "$SOURCE_TAG" --repo Zuljita/DungeonsOnAutomaticMonsters --pattern "$ASSET_NAME" --dir incoming --clobber
      - name: Validate and mirror package
        run: npm run publish:monster-package -- "incoming/$ASSET_NAME"
      - name: Smoke-check hosted art
        run: |
          node - <<'EOF'
          const pkg = JSON.parse(require('node:fs').readFileSync(`incoming/${process.env.ASSET_NAME}`, 'utf8'));
          const sample = pkg.monsters.slice(0, 3).flatMap((m) =>
            ['portrait', 'token', 'hexToken'].map((kind) => m.art?.[kind]?.url).filter(Boolean));
          (async () => {
            for (const url of sample) {
              const response = await fetch(url, { method: 'HEAD' });
              if (!response.ok) throw new Error(`${url} -> ${response.status}`);
              console.log(`ok ${url}`);
            }
          })();
          EOF
      - run: npm test
      - name: Commit public package snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monsters
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish monster package snapshot"
          git push
          # Pushes made with GITHUB_TOKEN do not trigger on:push workflows,
          # so kick the Cloudflare deploy explicitly.
          gh workflow run deploy.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
